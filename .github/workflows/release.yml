# Build SatX desktop installers on tag push (v*).
# Attaches a small set of renamed installers per OS (no .app internals or duplicate exes).
name: release

on:
  push:
    tags:
      - 'v*'
  # Run manually from Actions → release → Run workflow (no tag push required).
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify Tauri 2 pins
        run: npm run ensure:tauri2

      - name: Build release
        run: npm run tauri -- build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: satx-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify Tauri 2 pins
        run: npm run ensure:tauri2

      - name: Build release
        run: npm run tauri -- build

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v4
        with:
          name: satx-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify Tauri 2 pins
        run: npm run ensure:tauri2

      - name: Build release
        run: npm run tauri -- build

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: satx-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  publish-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage release assets (flat, consistent names)
        run: |
          set -euo pipefail
          REF="${{ steps.tag.outputs.name }}"
          VERSION="${REF#v}"
          OUT="release-upload"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          shopt -s nullglob globstar

          for f in artifacts/**/*.msi; do
            cp "$f" "$OUT/SatX-${VERSION}-Windows-x64.msi"
          done

          for f in artifacts/**/*-setup.exe artifacts/**/*setup.exe; do
            cp "$f" "$OUT/SatX-${VERSION}-Windows-x64-Setup.exe"
          done

          for f in artifacts/**/*.dmg; do
            cp "$f" "$OUT/SatX-${VERSION}-macOS.dmg"
          done

          for f in artifacts/**/*.deb; do
            cp "$f" "$OUT/SatX-${VERSION}-Linux-x64.deb"
          done

          for f in artifacts/**/*.AppImage; do
            cp "$f" "$OUT/SatX-${VERSION}-Linux-x64.AppImage"
          done

          echo "Staged assets:"
          ls -la "$OUT"

          if [ -z "$(ls -A "$OUT")" ]; then
            echo "No release assets found."
            exit 1
          fi

      - name: Write release notes
        run: |
          REF="${{ steps.tag.outputs.name }}"
          VERSION="${REF#v}"
          cat > release-notes.md <<EOF
          ## SatX Tracker ${REF}

          Desktop satellite tracker — live 3D globe, filters, nearest list, optional Starlink dish mode.

          ### Downloads (pick your platform)

          | Platform | File | Notes |
          |----------|------|--------|
          | **Windows** | \`SatX-${VERSION}-Windows-x64.msi\` | Recommended — Windows Installer |
          | **Windows** | \`SatX-${VERSION}-Windows-x64-Setup.exe\` | Alternative NSIS setup |
          | **macOS** | \`SatX-${VERSION}-macOS.dmg\` | Open disk image, drag app to Applications |
          | **Linux** | \`SatX-${VERSION}-Linux-x64.deb\` | Debian / Ubuntu-style systems |
          | **Linux** | \`SatX-${VERSION}-Linux-x64.AppImage\` | Portable AppImage (if built) |

          ### Requirements

          - Internet for the first catalog download
          - Location permission optional (nearest list & Starlink matching)
          - **Starlink Fetch:** installed app on Starlink Wi‑Fi — see [user guide](https://github.com/bbuckle1959/SatX/blob/main/docs/user-guide.md)

          ### Documentation

          - [User guide](https://github.com/bbuckle1959/SatX/blob/main/docs/user-guide.md)
          - [Application overview](https://github.com/bbuckle1959/SatX/blob/main/docs/application-overview.md)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: SatX Tracker ${{ steps.tag.outputs.name }}
          body_path: release-notes.md
          generate_release_notes: false
          files: release-upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
