# Build SatX desktop installers on tag push (v*).
# Publishes three platform archives (zip / zip / tar.gz), each with installers + README.md + LICENSE.
name: release

on:
  push:
    tags:
      - 'v*'
  # Run manually from Actions → release → Run workflow (no tag push required).
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify Tauri 2 pins
        run: npm run ensure:tauri2

      - name: Build release
        run: npm run tauri -- build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v6
        with:
          name: satx-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify Tauri 2 pins
        run: npm run ensure:tauri2

      - name: Build release
        run: npm run tauri -- build

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v6
        with:
          name: satx-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify Tauri 2 pins
        run: npm run ensure:tauri2

      - name: Build release
        run: npm run tauri -- build

      - name: Upload Linux packages
        uses: actions/upload-artifact@v6
        with:
          name: satx-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  publish-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: satx-*
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: find artifacts -type f | sed 's/^/  /' || echo "(no files)"

      - name: Package platform archives (installers + docs)
        run: |
          sed -i 's/\r$//' scripts/package-release-archives.sh
          chmod +x scripts/package-release-archives.sh
          VERSION="${{ steps.tag.outputs.name }}"
          VERSION="${VERSION#v}"
          bash scripts/package-release-archives.sh "$VERSION" artifacts release-upload
          test -f "release-upload/SatX-${VERSION}-Windows-x64.zip"
          test -f "release-upload/SatX-${VERSION}-macOS.zip"
          test -f "release-upload/SatX-${VERSION}-Linux-x64.tar.gz"

      - name: Write release notes
        run: |
          REF="${{ steps.tag.outputs.name }}"
          VERSION="${REF#v}"
          cat > release-notes.md <<EOF
          ## SatX Tracker ${REF}

          Desktop satellite tracker — live 3D globe, filters, nearest list, optional Starlink dish mode.

          ### Downloads (pick your platform)

          Extract the archive for your OS. Each includes installers, \`README.md\`, \`LICENSE\`, \`ACKNOWLEDGMENTS.md\`, and the \`docs/\` folder (user guide, build notes).

          | Platform | File | Contents |
          |----------|------|----------|
          | **Windows** | \`SatX-${VERSION}-Windows-x64.zip\` | MSI, NSIS Setup.exe, README, LICENSE, docs/ |
          | **macOS** | \`SatX-${VERSION}-macOS.zip\` | \`.dmg\`, README, LICENSE, docs/, **INSTALL-macos.md** |
          | **Linux** | \`SatX-${VERSION}-Linux-x64.tar.gz\` | \`.deb\`, AppImage (if built), README, LICENSE, docs/ |

          ### macOS: “damaged” or “can’t be opened”

          The app is **not corrupted**. GitHub CI builds are **unsigned**, so Gatekeeper blocks the first launch. Inside the macOS zip, read **INSTALL-macos.md**, or:

          1. Drag **SatX** from the \`.dmg\` to **Applications**.
          2. **Control-click** the app in Applications → **Open** → **Open** (once).
          3. Or run: \`xattr -cr /Applications/SatX.app\`

          Signed/notarized releases require Apple Developer signing in CI (see [docs/running/release-builds.md](https://github.com/bbuckle1959/SatX/blob/main/docs/running/release-builds.md)).

          ### Requirements

          - Internet for the first catalog download
          - Location permission optional (nearest list & Starlink matching)
          - **Starlink Fetch:** installed app on Starlink Wi‑Fi — see [user guide](https://github.com/bbuckle1959/SatX/blob/main/docs/user-guide.md)

          ### Documentation

          - [User guide](https://github.com/bbuckle1959/SatX/blob/main/docs/user-guide.md)
          - [Application overview](https://github.com/bbuckle1959/SatX/blob/main/docs/application-overview.md)
          EOF

      - name: Verify release archives exist
        run: |
          ls -la release-upload/
          test "$(find release-upload -maxdepth 1 -name '*.zip' -o -name '*.tar.gz' | wc -l)" -eq 3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: SatX Tracker ${{ steps.tag.outputs.name }}
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release-upload/SatX-*-Windows-x64.zip
            release-upload/SatX-*-macOS.zip
            release-upload/SatX-*-Linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
