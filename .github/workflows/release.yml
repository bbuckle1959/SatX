# Build SatX desktop installers on tag push (v*).
# Artifacts: src-tauri/target/release/bundle/** per OS.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify Tauri 2 pins
        run: npm run ensure:tauri2

      # GHA images ship MSVC on PATH (Enterprise 2022); tauri-dev.cmd targets local Build Tools paths.
      - name: Build release
        run: npm run tauri -- build

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: satx-windows
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/release/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Verify Tauri 2 pins
        run: npm run ensure:tauri2

      - name: Build release
        run: npm run tauri -- build

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v4
        with:
          name: satx-macos
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify Tauri 2 pins
        run: npm run ensure:tauri2

      - name: Build release
        run: npm run tauri -- build

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: satx-linux
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release files
        run: find release-artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
