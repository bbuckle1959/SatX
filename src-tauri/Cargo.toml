[package]
name = "satx"
version = "0.1.0"
description = "SatX satellite and space debris tracker"
authors = ["barry"]
edition = "2021"

[lib]
name = "satx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = ">=2.0.0, <3", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
tauri = { version = ">=2.0.0, <3", features = [] }
